<button
  type="button"
  class="app-icon-btn"
  (click)="themeService.toggleTheme()"
  [attr.aria-label]="
    themeService.isDarkTheme() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'
  "
>
  <lucide-icon
    [img]="themeService.isDarkTheme() ? SunIcon : MoonIcon"
    [size]="18"
  ></lucide-icon>
</button>
