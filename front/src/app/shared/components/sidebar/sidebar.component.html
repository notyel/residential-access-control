<div class="sidebar">
  <a
    class="sidebar__brand"
    routerLink="/access-control"
    (click)="navigate.emit()"
  >
    <span class="sidebar__logo">
      <lucide-icon [img]="Box" [size]="18"></lucide-icon>
    </span>
    <span>ZENTRYAL</span>
  </a>

  <nav class="sidebar__nav app-scroll-y" aria-label="Principal">
    @if (menuService.loadFailed()) {
    <div class="sidebar__error" role="alert">
      <p>No se pudo cargar el menú.</p>
      <button type="button" class="sidebar__link" (click)="loadMenu()">
        <lucide-icon [img]="Retry" [size]="18"></lucide-icon>
        <span>Reintentar</span>
      </button>
    </div>
    }
    @for (section of menuService.sections(); track $index) {
    @if (section.group) {
    <p class="sidebar__group" [id]="'menu-group-' + $index">
      {{ section.group }}
    </p>
    }
    <ul [attr.aria-labelledby]="section.group ? 'menu-group-' + $index : null">
      @for (item of section.items; track item.path) {
      <li>
        <a
          class="sidebar__link"
          [routerLink]="item.path"
          routerLinkActive="is-active"
          ariaCurrentWhenActive="page"
          (click)="navigate.emit()"
        >
          <lucide-icon [img]="getMenuIcon(item.icon)" [size]="18"></lucide-icon>
          <span>{{ item.name }}</span>
        </a>
      </li>
      }
    </ul>
    }
  </nav>

  <div class="sidebar__footer">
    <button type="button" class="sidebar__link" (click)="logout()">
      <lucide-icon [img]="LogOut" [size]="18"></lucide-icon>
      <span>Cerrar sesión</span>
    </button>
  </div>
</div>
