<div class="page-layout">
  <div class="dashboard-header">
    <h1 class="page-title">Panel de Control</h1>
  </div>

  <!-- Quick Actions -->
  <div class="quick-actions">
    <div
      class="action-card primary"
      (click)="registerVisit()"
      role="button"
      tabindex="0"
    >
      <div class="action-icon">
        <lucide-icon [img]="PlusIcon" [size]="32"></lucide-icon>
      </div>
      <div class="action-content">
        <h3>Registrar Visita</h3>
        <p>Dar acceso a un nuevo visitante</p>
      </div>
      <div class="action-arrow">
        <lucide-icon [img]="ArrowRightIcon" [size]="24"></lucide-icon>
      </div>
    </div>
  </div>
  <!-- Statistics Grid -->
  <div class="dashboard-grid">
    <app-stats-card
      title="Visitantes Activos"
      [value]="1"
      description="Actualmente en el conjunto"
      [icon]="UsersIcon"
    >
    </app-stats-card>

    <app-stats-card
      title="Visitas Hoy"
      [value]="2"
      description="Total de ingresos"
      [icon]="CalendarIcon"
    >
    </app-stats-card>

    <app-stats-card
      title="Tiempo Promedio"
      [value]="'30m'"
      description="Duración de visitas"
      [icon]="ClockIcon"
    >
    </app-stats-card>

    <app-stats-card
      title="Total Registros"
      [value]="totalVisitsThisMonth()"
      description="Visitas este mes"
      [icon]="TrendingUpIcon"
    >
    </app-stats-card>
  </div>

  <!-- Recent Visits Section -->
  <div class="recent-visits">
    <div class="recent-visits-header">
      <lucide-icon [img]="CalendarIcon" class="icon" [size]="24"></lucide-icon>
      <h2>Últimas Visitas</h2>
    </div>

    <div class="visits-list">
      @for (visit of latestVisits(); track $index) {
      <div class="visit-item">
        <div class="visit-info">
          <span class="visitor-name">{{ visit.visitorFullName }}</span>
          <span class="visit-time">{{
            visit.entryTime | date : "short" : "es-CO"
          }}</span>
        </div>
        <div class="visit-status active">Activo</div>
      </div>
      } @empty {
      <div class="empty-state">
        <p>No hay visitas recientes para mostrar</p>
      </div>
      }
    </div>
  </div>
</div>
