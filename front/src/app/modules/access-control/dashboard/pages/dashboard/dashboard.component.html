<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
  <mat-card>
    <mat-card-header>
      <mat-card-title>
        <lucide-angular [name]="UsersIcon" class="icon"></lucide-angular>
        Total Visits This Month
      </mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <p class="text-4xl font-bold">{{ totalVisitsThisMonth() }}</p>
    </mat-card-content>
  </mat-card>

  <mat-card>
    <mat-card-header>
      <mat-card-title>
        <lucide-angular [name]="CalendarIcon" class="icon"></lucide-angular>
        Latest Visits
      </mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <mat-list>
        @for (visit of latestVisits(); track $index) {
        <mat-list-item>
          <span matListItemTitle>{{ visit.visitorFullName }}</span>
          <span matListItemLine>{{ visit.entryTime | date : 'short' }}</span>
        </mat-list-item>
        }
      </mat-list>
    </mat-card-content>
  </mat-card>
</div>
