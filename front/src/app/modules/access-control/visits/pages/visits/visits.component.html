<div class="p-6">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold">Visitas</h1>
    <button
      mat-flat-button
      color="primary"
      [routerLink]="['/access-control/visits/register']"
    >
      <lucide-icon [img]="PlusCircleIcon" class="mr-2"></lucide-icon>
      Registrar Visita
    </button>
  </div>

  <form [formGroup]="filterForm" (ngSubmit)="onFilter()" class="mb-6">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <mat-form-field>
        <mat-label>Fecha de Inicio</mat-label>
        <input
          matInput
          [matDatepicker]="pickerStart"
          formControlName="startDate"
        />
        <mat-datepicker-toggle
          matSuffix
          [for]="pickerStart"
        ></mat-datepicker-toggle>
        <mat-datepicker #pickerStart></mat-datepicker>
      </mat-form-field>
      <mat-form-field>
        <mat-label>Fecha de Fin</mat-label>
        <input matInput [matDatepicker]="pickerEnd" formControlName="endDate" />
        <mat-datepicker-toggle
          matSuffix
          [for]="pickerEnd"
        ></mat-datepicker-toggle>
        <mat-datepicker #pickerEnd></mat-datepicker>
      </mat-form-field>
      <button mat-flat-button color="primary" type="submit">
        <lucide-icon [img]="FilterIcon" class="mr-2"></lucide-icon>
        Filtrar
      </button>
    </div>
  </form>

  <table
    mat-table
    [dataSource]="visits().items"
    class="mat-elevation-z8 w-full"
  >
    <!-- Visitor Column -->
    <ng-container matColumnDef="visitor">
      <th mat-header-cell *matHeaderCellDef>Visitante</th>
      <td mat-cell *matCellDef="let visit">{{ visit.visitorName }}</td>
    </ng-container>

    <!-- Date Column -->
    <ng-container matColumnDef="date">
      <th mat-header-cell *matHeaderCellDef>Fecha</th>
      <td mat-cell *matCellDef="let visit">
        {{ visit.createdAt | date : "short" }}
      </td>
    </ng-container>

    <!-- Actions Column -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let visit"></td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  <mat-paginator
    [length]="totalCount"
    [pageSize]="pageSize"
    [pageIndex]="pageIndex"
    (page)="onPageChange($event)"
    aria-label="Seleccionar página"
  >
  </mat-paginator>
</div>
