<app-page-header
  title="Visitas"
  subtitle="Registro y seguimiento de visitas al conjunto residencial"
  [showButton]="true"
  buttonText="Registrar Visita"
  [buttonIcon]="PlusCircleIcon"
  buttonColor="primary"
  [buttonRoute]="['/access-control/visits/register']"
  *appIfRole="['Admin', 'Guard']"
></app-page-header>

<div class="page-layout">
  <form [formGroup]="filterForm" (ngSubmit)="onFilter()" class="filter-form">
    <div class="filter-grid">
      <mat-form-field>
        <mat-label>Fecha de Inicio</mat-label>
        <input
          matInput
          [matDatepicker]="pickerStart"
          formControlName="startDate"
        />
        <mat-datepicker-toggle
          matSuffix
          [for]="pickerStart"
        ></mat-datepicker-toggle>
        <mat-datepicker #pickerStart></mat-datepicker>
      </mat-form-field>
      <mat-form-field>
        <mat-label>Fecha de Fin</mat-label>
        <input matInput [matDatepicker]="pickerEnd" formControlName="endDate" />
        <mat-datepicker-toggle
          matSuffix
          [for]="pickerEnd"
        ></mat-datepicker-toggle>
        <mat-datepicker #pickerEnd></mat-datepicker>
      </mat-form-field>
      <button mat-flat-button color="primary" type="submit">
        <lucide-icon [img]="FilterIcon"></lucide-icon>
        Filtrar
      </button>
    </div>
  </form>

  <table
    mat-table
    [dataSource]="visits().items"
    class="mat-elevation-z8 data-table"
  >
    <!-- Visitor Column -->
    <ng-container matColumnDef="visitor">
      <th mat-header-cell *matHeaderCellDef>Visitante</th>
      <td mat-cell *matCellDef="let visit">
        {{ visit.person.firstName }} {{ visit.person.lastName }}
      </td>
    </ng-container>

    <!-- Document Column -->
    <ng-container matColumnDef="document">
      <th mat-header-cell *matHeaderCellDef>Documento</th>
      <td mat-cell *matCellDef="let visit">
        {{ visit.person.documentNumber }}
      </td>
    </ng-container>

    <!-- Date Column -->
    <ng-container matColumnDef="date">
      <th mat-header-cell *matHeaderCellDef>Fecha</th>
      <td mat-cell *matCellDef="let visit">
        {{ visit.createdAt | date : "short" }}
      </td>
    </ng-container>

    <!-- Actions Column -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let visit"></td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  <mat-paginator
    [length]="totalCount"
    [pageSize]="pageSize"
    [pageIndex]="pageIndex"
    (page)="onPageChange($event)"
    aria-label="Seleccionar página"
  >
  </mat-paginator>
</div>
