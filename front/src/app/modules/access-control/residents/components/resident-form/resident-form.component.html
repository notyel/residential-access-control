<form class="app-form-layout" [formGroup]="form()">
  <div class="app-form-main">
    @if (errorMessage()) {
    <p class="app-alert" role="alert">{{ errorMessage() }}</p>
    }

    <app-form-section title="Datos del residente" [step]="1">
      <div class="app-form-grid">
        <mat-form-field>
          <mat-label>Nombre</mat-label>
          <input matInput formControlName="firstName" />
          <mat-error>Campo obligatorio</mat-error>
        </mat-form-field>

        <mat-form-field>
          <mat-label>Apellido</mat-label>
          <input matInput formControlName="lastName" />
          <mat-error>Campo obligatorio</mat-error>
        </mat-form-field>

        <mat-form-field>
          <mat-label>Número de apartamento</mat-label>
          <input matInput formControlName="apartmentNumber" />
          <mat-error>Campo obligatorio</mat-error>
        </mat-form-field>
      </div>
    </app-form-section>

    @if (form().contains('email')) {
    <app-form-section title="Acceso" [step]="2">
      <div class="app-form-grid">
        <mat-form-field class="span-2">
          <mat-label>Correo electrónico</mat-label>
          <input
            matInput
            type="email"
            formControlName="email"
            autocomplete="off"
          />
          <mat-error>Ingresa un correo válido</mat-error>
        </mat-form-field>

        <mat-form-field>
          <mat-label>Contraseña</mat-label>
          <input
            matInput
            type="password"
            formControlName="password"
            autocomplete="new-password"
          />
          <mat-error>Campo obligatorio</mat-error>
        </mat-form-field>
      </div>
    </app-form-section>
    }
  </div>
</form>
