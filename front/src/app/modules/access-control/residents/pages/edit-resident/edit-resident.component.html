<div class="p-6">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Editar Residente</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="residentForm" (ngSubmit)="onSubmit()">
        <mat-form-field class="w-full">
          <mat-label>Nombre</mat-label>
          <input matInput formControlName="firstName" />
        </mat-form-field>

        <mat-form-field class="w-full">
          <mat-label>Apellido</mat-label>
          <input matInput formControlName="lastName" />
        </mat-form-field>

        <mat-form-field class="w-full">
          <mat-label>Número de Apartamento</mat-label>
          <input matInput formControlName="apartmentNumber" />
        </mat-form-field>

        <div *ngIf="errorMessage" class="text-red-500 my-4">
          {{ errorMessage }}
        </div>

        <button
          mat-flat-button
          color="primary"
          type="submit"
          [disabled]="!residentForm.valid"
          class="icon-left"
        >
          <lucide-icon [img]="SaveIcon"></lucide-icon>
          Guardar
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
