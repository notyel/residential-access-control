<ng-template appPageActions>
  <a
    mat-flat-button
    routerLink="/access-control/residents/new"
    *appIfPermission="P.usersManage"
  >
    <lucide-icon [img]="PlusIcon" [size]="18"></lucide-icon>
    Nuevo residente
  </a>
</ng-template>

<div class="app-page">
  <app-data-table
    [loading]="isLoading()"
    [empty]="residents().length === 0"
    [error]="error()"
    emptyTitle="No hay residentes registrados"
    emptyMessage="Comienza agregando el primer residente al sistema."
    (retry)="loadResidents()"
  >
    <a
      tableEmptyAction
      mat-flat-button
      routerLink="/access-control/residents/new"
      *appIfPermission="P.usersManage"
    >
      <lucide-icon [img]="PlusIcon" [size]="18"></lucide-icon>
      Agregar residente
    </a>

    <table class="app-table">
      <thead>
        <tr>
          <th scope="col">Residente</th>
          <th scope="col">Apartamento</th>
          <th scope="col">Correo electrónico</th>
          <th scope="col"><span class="sr-only">Acciones</span></th>
        </tr>
      </thead>
      <tbody>
        @for (resident of residents(); track resident.id) {
        <tr>
          <td class="cell-primary">
            <div class="cell-person">
              <span class="app-avatar" aria-hidden="true">{{
                initials(resident.firstName, resident.lastName)
              }}</span>
              <span class="cell-ellipsis"
                >{{ resident.firstName }} {{ resident.lastName }}</span
              >
            </div>
          </td>
          <td class="text-mono">{{ resident.apartmentNumber }}</td>
          <td class="text-muted cell-ellipsis">{{ resident.email }}</td>
          <td class="cell-actions cell-aside">
            <a
              class="app-icon-btn"
              *appIfPermission="P.usersManage"
              [routerLink]="['/access-control/residents/edit', resident.id]"
              [attr.aria-label]="
                'Editar a ' + resident.firstName + ' ' + resident.lastName
              "
            >
              <lucide-icon [img]="EditIcon" [size]="18"></lucide-icon>
            </a>
          </td>
        </tr>
        }
      </tbody>
    </table>

    <app-paginator
      tableFooter
      [length]="totalCount()"
      [pageIndex]="pageIndex()"
      [pageSize]="pageSize()"
      (page)="onPageChange($event)"
    ></app-paginator>
  </app-data-table>
</div>
