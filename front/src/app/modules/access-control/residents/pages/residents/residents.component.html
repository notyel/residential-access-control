<div class="page-layout">
  <div class="page-header">
    <h1 class="page-title">Residentes</h1>
    <button
      mat-flat-button
      color="primary"
      [routerLink]="['/access-control/residents/new']"
      class="add-resident-btn"
    >
      <lucide-icon [img]="PlusCircleIcon"></lucide-icon>
      Nuevo Residente
    </button>
  </div>

  <div class="residents-container">
    <div *ngIf="isLoading()" class="loading-state">
      <div class="loading-spinner"></div>
      <p>Cargando residentes...</p>
    </div>

    <div *ngIf="!isLoading() && residents().length === 0" class="empty-state">
      <lucide-icon [img]="UserIcon" size="64"></lucide-icon>
      <h2>No hay residentes registrados</h2>
      <p>Comienza agregando el primer residente al sistema</p>
      <button
        mat-flat-button
        color="primary"
        [routerLink]="['/access-control/residents/new']"
      >
        <lucide-icon [img]="PlusCircleIcon"></lucide-icon>
        Agregar Primer Residente
      </button>
    </div>

    <div class="residents-grid" *ngIf="!isLoading() && residents().length > 0">
      <app-resident-card
        *ngFor="let resident of residents(); trackBy: trackByResident"
        [resident]="resident"
      ></app-resident-card>
    </div>
  </div>
</div>
