<div class="p-6">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold">Residentes</h1>
    <button
      mat-flat-button
      color="primary"
      [routerLink]="['/access-control/residents/new']"
    >
      <lucide-icon [img]="PlusCircleIcon" class="mr-2"></lucide-icon>
      Nuevo Residente
    </button>
  </div>

  <table mat-table [dataSource]="residents()" class="mat-elevation-z8 w-full">
    <!-- Name Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Nombre</th>
      <td mat-cell *matCellDef="let resident">
        {{ resident.firstName }} {{ resident.lastName }}
      </td>
    </ng-container>

    <!-- Apartment Column -->
    <ng-container matColumnDef="apartment">
      <th mat-header-cell *matHeaderCellDef>Apartamento</th>
      <td mat-cell *matCellDef="let resident">
        {{ resident.apartmentNumber }}
      </td>
    </ng-container>

    <!-- Actions Column -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let resident">
        <button
          mat-icon-button
          [routerLink]="['/access-control/residents/edit', resident.id]"
        >
          <lucide-icon [img]="EditIcon"></lucide-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>
