<app-page-header
  title="Nuevo Residente"
  subtitle="Registrar un nuevo residente en el sistema"
  [showButton]="true"
  buttonText="Cancelar"
  [buttonIcon]="ArrowLeftIcon"
  buttonColor="primary"
  [buttonRoute]="['/access-control/residents']"
></app-page-header>

<div class="page-layout">
  <mat-card>
    <mat-card-content>
      <form [formGroup]="residentForm" (ngSubmit)="onSubmit()">
        <mat-form-field class="form-field-full">
          <mat-label>Nombre</mat-label>
          <input matInput formControlName="firstName" />
        </mat-form-field>

        <mat-form-field class="form-field-full">
          <mat-label>Apellido</mat-label>
          <input matInput formControlName="lastName" />
        </mat-form-field>

        <mat-form-field class="form-field-full">
          <mat-label>Número de Apartamento</mat-label>
          <input matInput formControlName="apartmentNumber" />
        </mat-form-field>

        <mat-form-field class="form-field-full">
          <mat-label>Correo Electrónico</mat-label>
          <input matInput formControlName="email" />
        </mat-form-field>

        <mat-form-field class="form-field-full">
          <mat-label>Contraseña</mat-label>
          <input matInput formControlName="password" type="password" />
        </mat-form-field>

        <div *ngIf="errorMessage" class="error-message">
          {{ errorMessage }}
        </div>

        <button
          mat-flat-button
          color="primary"
          type="submit"
          [disabled]="!residentForm.valid"
        >
          <lucide-icon [img]="SaveIcon"></lucide-icon>
          Guardar
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
