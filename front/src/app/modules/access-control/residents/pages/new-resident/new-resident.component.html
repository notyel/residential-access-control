<ng-template appPageActions>
  <a
    mat-stroked-button
    class="hide-compact"
    routerLink="/access-control/residents"
  >
    Cancelar
  </a>
  <button
    mat-flat-button
    type="button"
    [disabled]="!canSave()"
    (click)="onSubmit()"
  >
    <lucide-icon [img]="SaveIcon" [size]="18"></lucide-icon>
    Guardar
  </button>
</ng-template>

<div class="app-page app-page--scroll app-form-page">
  <app-resident-form
    [form]="residentForm"
    [errorMessage]="errorMessage()"
  ></app-resident-form>
</div>
