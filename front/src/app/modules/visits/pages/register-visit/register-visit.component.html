<div class="register-visit-container">
  <form [formGroup]="visitForm" (ngSubmit)="onSubmit()">
    <h2>Register Visit</h2>
    <div class="form-group">
      <label for="visitorName">Visitor Name</label>
      <input type="text" id="visitorName" formControlName="visitorName" class="form-control">
    </div>
    <div class="form-group">
      <label for="visitorId">Visitor ID</label>
      <input type="text" id="visitorId" formControlName="visitorId" class="form-control">
    </div>
    <div class="form-group">
      <label for="vehiclePlate">Vehicle Plate (Optional)</label>
      <input type="text" id="vehiclePlate" formControlName="vehiclePlate" class="form-control">
    </div>
    <div class="form-group">
      <label for="residenceId">Residence ID</label>
      <input type="text" id="residenceId" formControlName="residenceId" class="form-control">
    </div>
    <div *ngIf="errorMessage" class="alert alert-danger">
      {{ errorMessage }}
    </div>
    <button type="submit" [disabled]="!visitForm.valid" class="btn btn-primary">Register</button>
  </form>
</div>
