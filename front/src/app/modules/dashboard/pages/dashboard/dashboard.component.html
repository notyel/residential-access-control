<div class="dashboard-container">
  <div class="card">
    <h2>Total Visits This Month</h2>
    <p>{{ totalVisitsThisMonth() }}</p>
  </div>
  <div class="card">
    <h2>Latest Visits</h2>
    <ul>
      @for (visit of latestVisits(); track visit.id) {
        <li>
          {{ visit.visitorName }} - {{ visit.createdAt | date: 'short' }}
        </li>
      }
    </ul>
  </div>
</div>
