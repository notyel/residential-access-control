<a class="skip-link" href="#" (click)="skipToContent($event)"
  >Saltar al contenido</a
>

<div
  class="shell"
  [class.shell--compact]="isCompact()"
  [class.shell--sidebar-open]="sidebarOpen()"
>
  @if (isCompact() && sidebarOpen()) {
  <div class="shell__scrim" (click)="closeOverlay()"></div>
  }

  <aside
    id="app-sidebar"
    class="shell__sidebar"
    [attr.inert]="sidebarOpen() ? null : ''"
    [cdkTrapFocus]="isCompact() && sidebarOpen()"
    [cdkTrapFocusAutoCapture]="isCompact() && sidebarOpen()"
  >
    <app-sidebar (navigate)="closeOverlay()"></app-sidebar>
  </aside>

  <div class="shell__main">
    <app-topbar
      [sidebarOpen]="sidebarOpen()"
      (menuToggle)="toggleSidebar()"
    ></app-topbar>
    <main #main id="main-content" class="shell__content app-main" tabindex="-1">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
